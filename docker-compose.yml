version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: voflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voflow
      POSTGRES_PASSWORD: voflow123
      POSTGRES_DB: voflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voflow -d voflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: voflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: voflow
      MINIO_ROOT_PASSWORD: voflow123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: voflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set myminio http://minio:9000 voflow voflow123;
        mc mb myminio/voflow --ignore-existing;
        mc anonymous set none myminio/voflow;
        echo "Bucket 'voflow' created successfully (private)";
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
